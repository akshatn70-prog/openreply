name: Android build

permissions:
  contents: write

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"
      - name: Assemble debug APK
        shell: bash
        run: |
          set +e
          gradle -p android assembleDebug --stacktrace 2>&1 | tee android-build.log
          status=${PIPESTATUS[0]}
          exit ${status}
      - name: Upload Android build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thehomeodoc-android-build-log
          path: android-build.log
      - name: Persist Android compiler error
        if: failure()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp android-build.log ANDROID_BUILD_ERROR.log
          git add ANDROID_BUILD_ERROR.log
          git commit -m "ci: capture Android build error" || exit 0
          git push
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: thehomeodoc-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
